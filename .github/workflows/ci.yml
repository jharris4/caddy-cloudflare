name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  image:
    # the image is only published on a tag, so build it here too -- otherwise
    # a broken Dockerfile is not discovered until release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # loaded into the daemon so the smoke tests below can run it, which only
      # works for a single platform -- this is the runner's own architecture
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: caddy-cloudflare:ci

      - name: Check the Cloudflare DNS module is compiled in
        run: |
          docker run --rm --entrypoint caddy caddy-cloudflare:ci version
          docker run --rm --entrypoint caddy caddy-cloudflare:ci list-modules \
            | grep -x dns.providers.cloudflare

      - name: Check the entrypoint refuses to start without a token
        run: |
          if docker run --rm caddy-cloudflare:ci version 2> stderr.txt; then
            echo "entrypoint started without a token file" >&2
            exit 1
          fi
          grep -q "Cloudflare API token file is missing" stderr.txt

      # release.yml publishes linux/arm64 for the secondary host, so build it
      # here too. Neither loaded nor pushed: this only has to prove that a
      # multi-architecture build succeeds before a tag depends on it.
      - name: Build every published platform
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: caddy-cloudflare:ci-multiarch
